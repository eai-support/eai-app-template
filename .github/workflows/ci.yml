name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eai-app-template-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  APPLICATION_PACKAGE_PRODUCER_SHA: caaf4fb0de88f63d2294a37cfd57772b8237d559

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Configure npm for GitHub Packages
        run: |
          echo "@enterpriseaigroup:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Test application-package bootstrap boundary
        run: npm run test:application-package-bootstrap

      - name: Resolve application-package source
        id: application-package-source
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-application-package-bootstrap.mjs resolve

      - name: Create exact producer checkout token
        id: producer-token
        if: steps.application-package-source.outputs.bootstrap == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.EAI_TESTING_APP_ID }}
          private-key: ${{ secrets.EAI_TESTING_APP_PRIVATE_KEY }}
          owner: enterpriseaigroup
          repositories: enterpriseai-packages
          permission-contents: read

      - name: Check out exact application-package producer
        if: steps.application-package-source.outputs.bootstrap == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: enterpriseaigroup/enterpriseai-packages
          ref: ${{ env.APPLICATION_PACKAGE_PRODUCER_SHA }}
          path: .ci/application-package-producer
          token: ${{ steps.producer-token.outputs.token }}
          persist-credentials: false

      - name: Build and verify exact application-package producer
        id: producer-package
        if: steps.application-package-source.outputs.bootstrap == 'true'
        working-directory: .ci/application-package-producer
        shell: bash
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/scripts/ci-application-package-bootstrap.mjs" verify-producer "$PWD"
          npm ci --workspace=@enterpriseaigroup/application-package --include-workspace-root=false
          npm run build --workspace=@enterpriseaigroup/application-package
          package_dir="$RUNNER_TEMP/application-package"
          mkdir -p "$package_dir"
          pack_json="$(npm pack ./packages/application-package --pack-destination "$package_dir" --json)"
          tarball="$(node -e 'const value=JSON.parse(process.argv[1]); if(value.length!==1) process.exit(1); process.stdout.write(require("node:path").resolve(process.argv[2], value[0].filename));' "$pack_json" "$package_dir")"
          node "$GITHUB_WORKSPACE/scripts/ci-application-package-bootstrap.mjs" verify-tarball "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Install dependencies from published package
        if: steps.application-package-source.outputs.bootstrap != 'true'
        # npm ci can miss optional native bindings used by Tailwind/Next on Ubuntu.
        run: npm install

      - name: Install dependencies with PR-only producer package
        if: steps.application-package-source.outputs.bootstrap == 'true'
        # SECURITY: Keep the lock active so every dependency except the exact
        # producer tarball still resolves from its reviewed immutable URL.
        run: npm install --no-save "${{ steps.producer-package.outputs.tarball }}"

      - name: Verify installed application-package contract
        run: |
          node scripts/ci-application-package-bootstrap.mjs verify-installed
          git diff --exit-code -- package.json package-lock.json eai.application.schema-lock.json

      - name: Install Linux native CSS bindings
        run: npm install --no-save lightningcss-linux-x64-gnu@1.30.2 @tailwindcss/oxide-linux-x64-gnu@4.1.18

      - name: Build object types
        run: npm run build:object-types

      - name: Object type generator regression test
        run: npm run test:object-types-generator

      - name: Unit tests
        run: npm run test:unit:ci

      - name: Source-unknown handoff evidence test
        run: npm run test:source-unknown-evidence

      - name: AI workspace handoff guidance test
        run: npm run test:ai-workspace-guidance

      - name: Cross-platform lifecycle test
        run: npm run test:cross-platform-lifecycle

      - name: Issue attachment moderation test
        run: node --test tests/issue-attachment-moderation.test.cjs

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build
