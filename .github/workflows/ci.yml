name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eai-app-template-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        # npm ci can miss optional native bindings used by Tailwind/Next on Ubuntu.
        run: npm install

      - name: Install Linux native CSS bindings
        run: npm install --no-save lightningcss-linux-x64-gnu@1.30.2 @tailwindcss/oxide-linux-x64-gnu@4.1.18

      - name: Build object types
        run: npm run build:object-types

      - name: Object type generator regression test
        run: npm run test:object-types-generator

      - name: Release version resolver test
        run: npm run test:release-version

      - name: Unit tests
        run: npm run test:unit:ci

      - name: Source-unknown handoff evidence test
        run: npm run test:source-unknown-evidence

      - name: Locked CLI handoff install smoke
        run: node --test tests/locked-cli-install-smoke.test.mjs

      - name: AI workspace handoff guidance test
        run: npm run test:ai-workspace-guidance

      - name: Cross-platform lifecycle test
        run: npm run test:cross-platform-lifecycle

      - name: Issue attachment moderation test
        run: node --test tests/issue-attachment-moderation.test.cjs

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install browser for generated demo isolation
        run: npx playwright install --with-deps chromium

      - name: Verify generated demo browser isolation
        run: npm run test:generated-demo-isolation
