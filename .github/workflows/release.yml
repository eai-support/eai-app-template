# Cuts a version tag for reviewed template main commits that passed CI.
#
# Consumers (eai-cli `linked-sources.json`, Admin-Portal generated-app export)
# pin to these releases instead of tracking the main branch, so a template
# revision can be named, reproduced, and rolled back.
#
# This workflow never commits to main: it tags the already-tested commit. That
# keeps `package.json` out of the release path and avoids the CI -> release ->
# CI loop a version-bump commit would create.
name: Release

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver segment to bump for this release'
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: eai-app-template-release
  cancel-in-progress: false

jobs:
  release:
    name: Tag reviewed template revision
    # Generated repositories inherit this workflow; only the template's
    # immutable repository identity may publish template release tags.
    if: >-
      github.repository == 'eai-support/eai-app-template' &&
      github.repository_id == '1205696460' &&
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify exact main commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          test "$HEAD_SHA" = "$GITHUB_SHA" || {
            echo 'The workflow identity is not the tested source commit.' >&2
            exit 1
          }
          git fetch origin main --depth=1
          test "$HEAD_SHA" = "$(git rev-parse refs/remotes/origin/main)" || {
            echo 'The tested source commit is no longer main.' >&2
            exit 1
          }
          PASSED=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="$HEAD_SHA" -f branch=main -f status=success \
            --jq '[.workflow_runs[] | select(.event == "push" and .conclusion == "success")] | length')
          test "$PASSED" -gt 0 || {
            echo 'No successful main-push CI run exists for the exact source commit.' >&2
            exit 1
          }

      - name: Refuse partial release tags
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXISTING=$(git tag --points-at HEAD --list 'v*' | head -n1)
          if [ -n "$EXISTING" ]; then
            IMMUTABLE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${EXISTING}" --jq .immutable)
            COMPLETE=$(gh release view "$EXISTING" --json assets \
              --jq '[.assets[].name] | sort | . == ["producer-manifest.json", "producer-manifest.sigstore.json"]')
            test "$IMMUTABLE" = 'true' && test "$COMPLETE" = 'true' || {
              echo "Existing tag ${EXISTING} lacks the complete attested producer release." >&2
              exit 1
            }
            echo "::notice::$(git rev-parse --short HEAD) is already released as ${EXISTING}."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the next release version
        id: version
        if: steps.guard.outputs.release == 'true'
        run: |
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          NEXT=$(node scripts/next-release-version.mjs "${LATEST}" "${{ inputs.bump || 'patch' }}")
          echo "previous=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Prepare the release tag locally
        if: steps.guard.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Template release $TAG"

      - name: Generate the exact-tree producer manifest
        if: steps.guard.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          node scripts/generate-producer-manifest.mjs \
            --tag "$TAG" --out dist/release/producer-manifest.json

      - name: Attest the producer manifest
        if: steps.guard.outputs.release == 'true'
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/release/producer-manifest.json

      - name: Verify the attestation before publication
        if: steps.guard.outputs.release == 'true'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          test -s "$BUNDLE_PATH"
          SOURCE_SHA=$(git rev-parse HEAD)
          REPO_ID=$(gh attestation verify dist/release/producer-manifest.json \
            --repo "$GITHUB_REPOSITORY" --bundle "$BUNDLE_PATH" \
            --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" \
            --source-digest "$SOURCE_SHA" --source-ref refs/heads/main \
            --format json \
            --jq '.[0].verificationResult.signature.certificate.sourceRepositoryIdentifier')
          test "$REPO_ID" = "$GITHUB_REPOSITORY_ID" || {
            echo 'Attestation certificate repository ID mismatch.' >&2
            exit 1
          }
          cp "$BUNDLE_PATH" dist/release/producer-manifest.sigstore.json

      - name: Require release verifier App credentials
        if: steps.guard.outputs.release == 'true'
        env:
          APP_ID: ${{ vars.TEMPLATE_RELEASE_ADMIN_READ_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.TEMPLATE_RELEASE_ADMIN_READ_PRIVATE_KEY }}
        run: |
          test -n "$APP_ID" && test -n "$APP_PRIVATE_KEY" || {
            echo 'Repository-scoped immutable-release verifier App credentials are missing.' >&2
            exit 1
          }

      - name: Create repository-scoped immutable-release read token
        if: steps.guard.outputs.release == 'true'
        id: immutable-read-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.TEMPLATE_RELEASE_ADMIN_READ_APP_ID }}
          private-key: ${{ secrets.TEMPLATE_RELEASE_ADMIN_READ_PRIVATE_KEY }}
          owner: eai-support
          repositories: eai-app-template
          permission-administration: read

      - name: Require immutable releases before creating a release
        if: steps.guard.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ steps.immutable-read-token.outputs.token }}
        run: |
          set -euo pipefail
          ENABLED=$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/immutable-releases" --jq .enabled)
          test "$ENABLED" = 'true' || {
            echo 'Immutable releases must be enabled before a producer release is created.' >&2
            exit 1
          }

      - name: Push the release tag
        if: steps.guard.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          git push origin "refs/tags/$TAG"

      - name: Prepare the GitHub release with all assets
        if: steps.guard.outputs.release == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: |
            dist/release/producer-manifest.json
            dist/release/producer-manifest.sigstore.json
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true

      - name: Verify uploaded draft release assets
        if: steps.guard.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          REMOTE_SHA=$(git ls-remote origin "refs/tags/${TAG}^{}" | cut -f1)
          test "$REMOTE_SHA" = "$(git rev-parse HEAD)" || {
            echo "Draft release ${TAG} does not point at the attested source commit." >&2
            exit 1
          }
          DRAFT=$(gh release view "$TAG" --json isDraft,assets \
            --jq '.isDraft and ([.assets[].name] | sort | . == ["producer-manifest.json", "producer-manifest.sigstore.json"])')
          test "$DRAFT" = 'true' || {
            echo "Draft release ${TAG} is absent or has unexpected assets." >&2
            exit 1
          }
          DOWNLOADED=$(mktemp -d)
          trap 'rm -rf "$DOWNLOADED"' EXIT
          gh release download "$TAG" --dir "$DOWNLOADED"
          node scripts/verify-draft-release-assets.mjs dist/release "$DOWNLOADED"

      - name: Publish and read back immutable release
        if: steps.guard.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMMUTABLE_READ_TOKEN: ${{ steps.immutable-read-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$IMMUTABLE_READ_TOKEN"
          ENABLED=$(GH_TOKEN="$IMMUTABLE_READ_TOKEN" gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/immutable-releases" --jq .enabled)
          test "$ENABLED" = 'true' || {
            echo 'Immutable releases were disabled before publication.' >&2
            exit 1
          }
          REMOTE_SHA=$(git ls-remote origin "refs/tags/${TAG}^{}" | cut -f1)
          test "$REMOTE_SHA" = "$(git rev-parse HEAD)" || {
            echo "Draft release ${TAG} changed its source tag before publication." >&2
            exit 1
          }
          gh release edit "$TAG" --draft=false --latest
          IMMUTABLE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .immutable)
          COMPLETE=$(gh release view "$TAG" --json assets \
            --jq '[.assets[].name] | sort | . == ["producer-manifest.json", "producer-manifest.sigstore.json"]')
          test "$IMMUTABLE" = 'true' && test "$COMPLETE" = 'true' || {
            echo "Published release ${TAG} is not immutable with exact manifest assets." >&2
            exit 1
          }
          REMOTE_SHA=$(git ls-remote origin "refs/tags/${TAG}^{}" | cut -f1)
          test "$REMOTE_SHA" = "$(git rev-parse HEAD)" || {
            echo "Published release ${TAG} does not point at the attested source commit." >&2
            exit 1
          }
          DOWNLOADED=$(mktemp -d)
          trap 'rm -rf "$DOWNLOADED"' EXIT
          gh release download "$TAG" --dir "$DOWNLOADED"
          node scripts/verify-draft-release-assets.mjs dist/release "$DOWNLOADED"
