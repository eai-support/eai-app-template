name: EAI Generated App

on:
  push:
    branches:
      - "__DEFAULT_BRANCH__"
  pull_request:
    branches:
      - "__DEFAULT_BRANCH__"
    types:
      - opened
      - synchronize
      - reopened
      - closed
  workflow_dispatch:
    inputs:
      handover_to_cli:
        description: Validate an explicit Configurator to Configurator Plus handover without deployment.
        type: boolean
        default: false
      handover_operation_id:
        description: Operation ID from eai app workflow-setup --handover-from-no-code.
        type: string
      handover_nonce:
        description: One-time nonce from the handover setup.
        type: string

permissions:
  contents: read
  id-token: write

# SECURITY: these destinations live in a CODEOWNERS/ruleset-protected file.
# The per-operation file may bind identifiers, but it cannot redirect tokens.
env:
  EAI_WORKFLOW_EVIDENCE_BASE_URL: "__EVIDENCE_BASE_URL__"
  EAI_GITHUB_OIDC_AUDIENCE: "api://enterprise-ai-publicapi/generated-app"
  EAI_CLI_HANDOVER_OIDC_AUDIENCE: api://enterprise-ai-publicapi/source-unknown
  EAI_DEPLOYMENT_ENVIRONMENT: preview
  EAI_RELEASE_CHANNEL: preview
  EAI_MANAGED_REVIEW_CALLBACK_URL: "__MANAGED_REVIEW_CALLBACK_URL__"
  EAI_MANAGED_REVIEW_TARGET_TENANT_ID: "__TARGET_TENANT_ID__"

concurrency:
  group: eai-generated-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-merged-source:
    name: Resolve merged source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.review.outputs.eligible }}
      pull_request_number: ${{ steps.review.outputs.pull_request_number }}
      source_sha: ${{ steps.review.outputs.source_sha }}
    steps:
      - name: Bind protected main commit to one merged pull request
        id: review
        if: github.event_name == 'push' && github.ref == 'refs/heads/__DEFAULT_BRANCH__'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          if (event.repository?.full_name !== process.env.GITHUB_REPOSITORY ||
              event.repository?.default_branch !== "__DEFAULT_BRANCH__" ||
              !/^[a-f0-9]{40}$/.test(process.env.GITHUB_SHA || '')) {
            throw new Error('Protected branch event identity is invalid.');
          }
          let pulls;
          for (let attempt = 0; attempt < 5; attempt++) {
            const response = await fetch(
              `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/commits/${process.env.GITHUB_SHA}/pulls`,
              { headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
              } },
            );
            if (!response.ok) throw new Error('Unable to verify merged source pull request.');
            pulls = await response.json();
            if (!Array.isArray(pulls)) throw new Error('Invalid merged source response.');
            if (pulls.length > 0) break;
            if (attempt < 4) await new Promise(resolve => setTimeout(resolve, 1500));
          }
          const matches = pulls.filter(pr =>
            Number.isInteger(pr.number) && pr.number > 0 &&
            pr.merged_at && pr.merge_commit_sha === process.env.GITHUB_SHA &&
            pr.base?.ref === "__DEFAULT_BRANCH__" &&
            pr.base?.repo?.id === event.repository.id &&
            pr.head?.repo?.id === event.repository.id &&
            /^[a-f0-9]{40}$/.test(pr.head?.sha || '')
          );
          if (matches.length === 0 && pulls.length === 0) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'eligible=false\n');
          } else if (matches.length !== 1) {
            throw new Error('Protected branch commit has ambiguous or unsafe pull request authority.');
          } else {
            const pr = matches[0];
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `eligible=true\npull_request_number=${pr.number}\nsource_sha=${pr.head.sha}\n`);
          }
          NODE

  validate-generated-source:
    name: Validate generated source
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed') || (github.event_name == 'workflow_dispatch' && !inputs.handover_to_cli) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout unprivileged review source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate generated source binding
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const binding = JSON.parse(fs.readFileSync('.eai/generated-source-operation.json', 'utf8'));
          const expectedKeys = ['appKey', 'configHash', 'githubInstallationId', 'operationId', 'schemaVersion', 'tenantId'];
          if (binding.schemaVersion !== 'eai.generated_source_operation.v1' ||
              JSON.stringify(Object.keys(binding).sort()) !== JSON.stringify(expectedKeys)) {
            throw new Error('Generated source operation binding is invalid.');
          }
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Test
        run: npm test -- --runInBand --passWithNoTests

      - name: Build object type manifests
        run: npm run build:object-types --if-present

      - name: Build
        run: npm run build --if-present

  deploy-generated-source:
    name: Publish generated source
    needs: resolve-merged-source
    if: ${{ (github.event_name == 'push' && needs.resolve-merged-source.outputs.eligible == 'true') || (github.event_name == 'workflow_dispatch' && inputs.handover_to_cli) }}
    runs-on: ubuntu-latest
    environment: eai-generated-preview
    env:
      EAI_CLI_HANDOVER: ${{ github.event_name == 'workflow_dispatch' && inputs.handover_to_cli }}
      EAI_REVIEW_PULL_REQUEST_NUMBER: ${{ needs.resolve-merged-source.outputs.pull_request_number }}
      EAI_REVIEW_SOURCE_SHA: ${{ needs.resolve-merged-source.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bind canonical evidence producer
        id: evidence-producer
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { createHash } = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const git = (...args) => execFileSync('git', args, {
            encoding: 'utf8',
            maxBuffer: 1024 * 1024,
          }).trim();
          if (!/^[a-f0-9]{40}$/.test(process.env.GITHUB_SHA || '') ||
              git('rev-parse', 'HEAD') !== process.env.GITHUB_SHA) {
            throw new Error('Evidence producer checkout does not match the workflow commit.');
          }
          const trackedBytes = (sourcePath) => {
            const treeEntry = git('ls-tree', 'HEAD', '--', sourcePath);
            const match = /^(100644|100755) blob ([a-f0-9]{40})	(.+)$/.exec(treeEntry);
            if (!match || match[3] !== sourcePath) {
              throw new Error('Evidence producer source is not a tracked regular blob: ' + sourcePath);
            }
            if (!fs.constants.O_NOFOLLOW || !fs.constants.O_NONBLOCK) {
              throw new Error('No-follow evidence producer reads are unavailable.');
            }
            const descriptor = fs.openSync(
              sourcePath,
              fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW | fs.constants.O_NONBLOCK,
            );
            try {
              const before = fs.fstatSync(descriptor);
              if (!before.isFile() || before.nlink !== 1 || before.size < 1 ||
                  before.size > 1024 * 1024) {
                throw new Error('Evidence producer source is not a bounded regular file.');
              }
              const bytes = Buffer.alloc(before.size);
              let offset = 0;
              while (offset < before.size) {
                const count = fs.readSync(descriptor, bytes, offset, before.size - offset, offset);
                if (count < 1) throw new Error('Evidence producer source was truncated.');
                offset += count;
              }
              const after = fs.fstatSync(descriptor);
              const pathAfter = fs.lstatSync(sourcePath);
              if (!pathAfter.isFile() || pathAfter.isSymbolicLink() || pathAfter.nlink !== 1 ||
                  after.dev !== before.dev || after.ino !== before.ino ||
                  pathAfter.dev !== before.dev || pathAfter.ino !== before.ino ||
                  after.size !== before.size || pathAfter.size !== before.size ||
                  after.mtimeMs !== before.mtimeMs || pathAfter.mtimeMs !== before.mtimeMs) {
                throw new Error('Evidence producer source changed during the read.');
              }
              const blobSha = createHash('sha1').update('blob ' + bytes.length + '\0').update(bytes).digest('hex');
              if (blobSha !== match[2]) {
                throw new Error('Evidence producer bytes do not match the workflow commit.');
              }
              return { bytes, blobSha };
            } finally {
              fs.closeSync(descriptor);
            }
          };
          const workflow = trackedBytes('.github/workflows/eai-app.yml');
          const collector = trackedBytes('scripts/source-unknown-deployment-evidence.mjs');
          const collectorDigest = 'sha256:' + createHash('sha256').update(collector.bytes).digest('hex');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            'workflow_blob_sha=' + workflow.blobSha + '\n' +
            'collector_digest=' + collectorDigest + '\n');
          NODE

      - name: Load generated source operation
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const binding = JSON.parse(
            fs.readFileSync('.eai/generated-source-operation.json', 'utf8'),
          );
          if (binding.schemaVersion !== 'eai.generated_source_operation.v1') {
            throw new Error('Unsupported generated source operation schema.');
          }
          const expectedKeys = [
            'appKey',
            'configHash',
            'githubInstallationId',
            'operationId',
            'schemaVersion',
            'tenantId',
          ];
          if (JSON.stringify(Object.keys(binding).sort()) !== JSON.stringify(expectedKeys)) {
            throw new Error('Generated source operation contains unsupported fields.');
          }
          const variables = {
            EAI_APP_KEY: binding.appKey,
            EAI_APP_SCOPE_TENANT_ID: "__TARGET_TENANT_ID__",
            EAI_TARGET_TENANT_ID: "__TARGET_TENANT_ID__",
            EAI_TENANT_ID: binding.tenantId,
            EAI_SOURCE_OPERATION_ID: binding.operationId,
            EAI_CONFIG_HASH: binding.configHash,
            EAI_GITHUB_INSTALLATION_ID: binding.githubInstallationId,
          };
          for (const [name, value] of Object.entries(variables)) {
            if (typeof value !== 'string' || !value || /[\r\n]/.test(value)) {
              throw new Error(`Invalid generated source operation value: ${name}`);
            }
            fs.appendFileSync(process.env.GITHUB_ENV, `${name}=${value}\n`);
          }
          const baseUrl = process.env.EAI_WORKFLOW_EVIDENCE_BASE_URL;
          if (!baseUrl) throw new Error('Protected workflow evidence base URL is missing.');
          const evidenceUrl = new URL(
            process.env.EAI_CLI_HANDOVER === 'true'
              ? `v4/platform/tenants/${encodeURIComponent(binding.tenantId)}/apps/${encodeURIComponent(binding.appKey)}/source-unknown/workflow-evidence`
              : `v4/platform/tenants/${encodeURIComponent(binding.tenantId)}/apps/${encodeURIComponent(binding.appKey)}/source-preparations/${encodeURIComponent(binding.operationId)}/workflow-evidence`,
            baseUrl.endsWith('/') ? baseUrl : `${baseUrl}/`,
          );
          if (process.env.EAI_CLI_HANDOVER === 'true') {
            const inputs = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')).inputs || {};
            const handover = {
              EAI_HANDOVER_OPERATION_ID: inputs.handover_operation_id,
              EAI_HANDOVER_NONCE: inputs.handover_nonce,
            };
            for (const [name, value] of Object.entries(handover)) {
              if (typeof value !== 'string' || !value || /[\r\n]/.test(value)) {
                throw new Error(`Missing or invalid handover input: ${name}`);
              }
            }
            console.log(`::add-mask::${handover.EAI_HANDOVER_NONCE}`);
            for (const [name, value] of Object.entries(handover)) {
              fs.appendFileSync(process.env.GITHUB_ENV, `${name}=${value}\n`);
            }
            fs.appendFileSync(process.env.GITHUB_ENV,
              `EAI_GITHUB_OIDC_AUDIENCE=${process.env.EAI_CLI_HANDOVER_OIDC_AUDIENCE}\n`);
          }
          evidenceUrl.searchParams.set(
            'targetTenantId',
            variables.EAI_TARGET_TENANT_ID,
          );
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `EAI_WORKFLOW_EVIDENCE_URL=${evidenceUrl.toString()}\n`,
          );
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        id: typecheck
        run: |
          if [ "$EAI_CLI_HANDOVER" = true ]; then npm run typecheck; else npm run typecheck --if-present; fi

      - name: Test
        id: test
        run: |
          if [ "$EAI_CLI_HANDOVER" = true ]; then npm test -- --runInBand; else npm test -- --runInBand --passWithNoTests; fi

      - name: Build object type manifests
        id: object-types
        run: |
          if [ "$EAI_CLI_HANDOVER" = true ]; then npm run build:object-types; else npm run build:object-types --if-present; fi

      - name: Build
        id: build
        run: |
          if [ "$EAI_CLI_HANDOVER" = true ]; then npm run build; else npm run build --if-present; fi

      - name: Summarise generated app contract
        env:
          EAI_APP_KEY: "__APP_KEY__"
          EAI_CONFIG_PATH: "src/eai.config/tenants/__APP_KEY__.config.ts"
          EAI_OBJECT_TYPES_PATH: "src/eai.config/object-types.ts"
          EAI_ENVIRONMENT: "eai-generated-preview"
          EAI_COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Generated app: ${EAI_APP_KEY}"
          echo "Config: ${EAI_CONFIG_PATH}"
          echo "Object types: ${EAI_OBJECT_TYPES_PATH}"
          echo "Environment: ${EAI_ENVIRONMENT}"
          echo "Commit: ${EAI_COMMIT_SHA}"
          if [ -z "${EAI_WORKFLOW_EVIDENCE_URL}" ]; then
            echo "PublicAPI workflow-evidence handoff is not configured for this repository yet."
          else
            echo "PublicAPI workflow-evidence handoff target is configured."
          fi

      - name: Prepare runtime image context
        if: (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.handover_to_cli)
        run: |
          set -euo pipefail
          if [ ! -d ".next/standalone" ]; then
            echo "Next.js standalone output is required for TenantInfra deployment."
            exit 1
          fi
          rm -rf .eai-build
          mkdir -p .eai-build/image-context/.next .eai-build/evidence
          cp -R .next/standalone/. .eai-build/image-context/
          cp -R .next/static .eai-build/image-context/.next/static
          if [ -d public ]; then
            cp -R public .eai-build/image-context/public
          fi
          cat > .eai-build/image-context/Dockerfile <<'DOCKERFILE'
          FROM node:22-alpine
          WORKDIR /app
          ENV NODE_ENV=production
          ENV PORT=3000
          ENV HOSTNAME=0.0.0.0
          COPY . .
          EXPOSE 3000
          CMD ["node", "server.js"]
          DOCKERFILE

      - name: Setup Docker Buildx
        if: (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.handover_to_cli)
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image archive
        id: build-image
        if: (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.handover_to_cli)
        uses: docker/build-push-action@v6
        with:
          context: .eai-build/image-context
          file: .eai-build/image-context/Dockerfile
          push: false
          outputs: type=oci,dest=.eai-build/eai-generated-app-image.tar

      - name: Collect runtime evidence
        id: runtime-evidence
        if: (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.handover_to_cli)
        run: |
          set -euo pipefail
          image_archive_hash="$(sha256sum .eai-build/eai-generated-app-image.tar | awk '{print $1}')"
          echo "archive_digest=sha256:${image_archive_hash}" >> "$GITHUB_OUTPUT"
          echo "image_digest=${{ steps.build-image.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Upload runtime image artifact
        id: image-artifact
        if: (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.handover_to_cli)
        uses: actions/upload-artifact@v4
        with:
          name: eai-generated-app-image
          path: .eai-build/eai-generated-app-image.tar
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Request GitHub OIDC token
        id: github-oidc
        if: (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.handover_to_cli)
        run: |
          set -euo pipefail
          if [ -z "${EAI_GITHUB_OIDC_AUDIENCE}" ]; then
            echo "The generated source operation OIDC audience is required."
            exit 1
          fi
          separator="?"
          case "$ACTIONS_ID_TOKEN_REQUEST_URL" in
            *"?"*) separator="&" ;;
          esac
          response="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${EAI_GITHUB_OIDC_AUDIENCE}")"
          token="$(node -e "const fs = require('node:fs'); const data = JSON.parse(fs.readFileSync(0, 'utf8')); if (!data.value) process.exit(1); process.stdout.write(data.value);" <<< "$response")"
          echo "::add-mask::$token"
          printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Submit validated Configurator Plus handover evidence
        if: success() && github.event_name == 'workflow_dispatch' && inputs.handover_to_cli
        env:
          WORKFLOW_BLOB_SHA: ${{ steps.evidence-producer.outputs.workflow_blob_sha }}
          COLLECTOR_DIGEST: ${{ steps.evidence-producer.outputs.collector_digest }}
          VALIDATION_OUTCOMES: ${{ steps.typecheck.outcome }},${{ steps.test.outcome }},${{ steps.object-types.outcome }},${{ steps.build.outcome }},${{ steps.build-image.outcome }},${{ steps.image-artifact.outcome }}
          ARTIFACT_DIGEST: ${{ steps.image-artifact.outputs.artifact-digest }}
          IMAGE_DIGEST: ${{ steps.runtime-evidence.outputs.image_digest }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const env = process.env;
          const outcomes = (env.VALIDATION_OUTCOMES || '').split(',');
          if (outcomes.length !== 6 || outcomes.some(value => value !== 'success')) {
            throw new Error('Configurator Plus handover requires successful validation and build steps.');
          }
          for (const name of ['EAI_HANDOVER_OPERATION_ID', 'EAI_HANDOVER_NONCE', 'EAI_TENANT_ID', 'EAI_APP_KEY']) {
            if (!env[name]) throw new Error(`Missing Configurator Plus handover binding: ${name}`);
          }
          const expectedUrl = new URL(
            `v4/platform/tenants/${encodeURIComponent(env.EAI_TENANT_ID)}/apps/${encodeURIComponent(env.EAI_APP_KEY)}/source-unknown/workflow-evidence`,
            env.EAI_WORKFLOW_EVIDENCE_BASE_URL.endsWith('/')
              ? env.EAI_WORKFLOW_EVIDENCE_BASE_URL : env.EAI_WORKFLOW_EVIDENCE_BASE_URL + '/',
          );
          if (env.EAI_TARGET_TENANT_ID) {
            expectedUrl.searchParams.set('targetTenantId', env.EAI_TARGET_TENANT_ID);
          }
          if (expectedUrl.protocol !== 'https:' || expectedUrl.toString() !== env.EAI_WORKFLOW_EVIDENCE_URL) {
            throw new Error('Configurator Plus handover evidence destination does not match the protected workflow.');
          }
          const digest = (value) => value?.startsWith('sha256:') ? value : `sha256:${value || ''}`;
          const artifactDigest = digest(env.ARTIFACT_DIGEST);
          const imageDigest = digest(env.IMAGE_DIGEST);
          if (![artifactDigest, imageDigest, env.EAI_CONFIG_HASH, env.COLLECTOR_DIGEST].every(value => /^sha256:[a-f0-9]{64}$/.test(value || '')) ||
              !/^[a-f0-9]{40}$/.test(env.GITHUB_SHA || '') ||
              !/^[a-f0-9]{40}$/.test(env.WORKFLOW_BLOB_SHA || '')) {
            throw new Error('Configurator Plus handover requires exact source and build digests.');
          }
          const schemaProvenance = JSON.parse(fs.readFileSync('eai.runtime.json', 'utf8')).schemaProvenance;
          if (!schemaProvenance) throw new Error('Configurator Plus handover requires schema provenance.');
          const evidence = {
            operationId: env.EAI_HANDOVER_OPERATION_ID,
            nonce: env.EAI_HANDOVER_NONCE,
            environment: env.EAI_DEPLOYMENT_ENVIRONMENT,
            workflowPath: '.github/workflows/eai-app.yml',
            workflowBlobSha: env.WORKFLOW_BLOB_SHA,
            collectorDigest: env.COLLECTOR_DIGEST,
            ref: env.GITHUB_REF,
            commitSha: env.GITHUB_SHA,
            configHash: env.EAI_CONFIG_HASH,
            artifactDigest,
            imageDigest,
            schemaProvenance,
            workflowRun: { id: env.GITHUB_RUN_ID, attempt: env.GITHUB_RUN_ATTEMPT },
            oidcClaims: {
              repository: env.GITHUB_REPOSITORY,
              ref: env.GITHUB_REF,
              sha: env.GITHUB_SHA,
              workflow_ref: `${env.GITHUB_REPOSITORY}/.github/workflows/eai-app.yml@${env.GITHUB_REF}`,
              run_id: env.GITHUB_RUN_ID,
            },
            validationSummary: { status: 'passed', cliHandover: { status: 'passed' } },
          };
          fs.writeFileSync('.eai-build/evidence/cli-handover.json', JSON.stringify(evidence));
          NODE
          curl -fsSL -X POST "${EAI_WORKFLOW_EVIDENCE_URL}" \
            -H "Authorization: Bearer ${{ steps.github-oidc.outputs.token }}" \
            -H "Content-Type: application/json" \
            --data @.eai-build/evidence/cli-handover.json \
            | tee .eai-build/evidence/cli-handover-response.json

      - name: Submit TenantInfra workflow evidence
        if: github.event_name == 'push'
        env:
          WORKFLOW_BLOB_SHA: ${{ steps.evidence-producer.outputs.workflow_blob_sha }}
          COLLECTOR_DIGEST: ${{ steps.evidence-producer.outputs.collector_digest }}
          ARTIFACT_DIGEST: ${{ steps.image-artifact.outputs.artifact-digest }}
          IMAGE_ARCHIVE_DIGEST: ${{ steps.runtime-evidence.outputs.archive_digest }}
          IMAGE_ARTIFACT_ID: ${{ steps.image-artifact.outputs.artifact-id }}
          IMAGE_DIGEST: ${{ steps.runtime-evidence.outputs.image_digest }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const env = process.env;
          const required = [
            'EAI_WORKFLOW_EVIDENCE_URL',
            'EAI_APP_SCOPE_TENANT_ID',
            'EAI_TARGET_TENANT_ID',
            'EAI_TENANT_ID',
            'EAI_APP_KEY',
            'EAI_SOURCE_OPERATION_ID',
            'EAI_CONFIG_HASH',
            'EAI_GITHUB_INSTALLATION_ID',
            'ARTIFACT_DIGEST',
            'IMAGE_ARCHIVE_DIGEST',
            'IMAGE_ARTIFACT_ID',
            'IMAGE_DIGEST',
            'WORKFLOW_BLOB_SHA',
            'COLLECTOR_DIGEST',
          ];
          const missing = required.filter((name) => !env[name]);
          if (missing.length > 0) {
            console.error('Missing workflow evidence environment: ' + missing.join(', '));
            process.exit(1);
          }
          let evidenceUrl;
          try {
            evidenceUrl = new URL(env.EAI_WORKFLOW_EVIDENCE_URL);
          } catch {
            console.error('EAI_WORKFLOW_EVIDENCE_URL must be a valid HTTPS URL.');
            process.exit(1);
          }
          if (evidenceUrl.protocol !== 'https:') {
            console.error('EAI_WORKFLOW_EVIDENCE_URL must be a valid HTTPS URL.');
            process.exit(1);
          }
          const expectedEvidenceSuffix =
            '/source-preparations/' +
            encodeURIComponent(env.EAI_SOURCE_OPERATION_ID) +
            '/workflow-evidence';
          if (!evidenceUrl.pathname.endsWith(expectedEvidenceSuffix)) {
            console.error(
              'EAI_WORKFLOW_EVIDENCE_URL does not match EAI_SOURCE_OPERATION_ID.',
            );
            process.exit(1);
          }
          const repository = env.GITHUB_REPOSITORY || '/';
          const [repoOwner, repoName] = repository.split('/', 2);
          const sha256Digest = (value) =>
            value && value.startsWith('sha256:') ? value : `sha256:${value || ''}`;
          const event = JSON.parse(fs.readFileSync(env.GITHUB_EVENT_PATH, 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('.eai-manifest.json', 'utf8'));
          const runtimeBinding = manifest.runtimeBinding;
          const workflowTemplate = runtimeBinding && runtimeBinding.workflowTemplate;
          const respondentAccess = runtimeBinding && runtimeBinding.respondentAccess;
          const sha256DigestPattern = /^sha256:[a-f0-9]{64}$/;
          if (
            !/^[a-f0-9]{40}$/.test(env.WORKFLOW_BLOB_SHA) ||
            !sha256DigestPattern.test(env.COLLECTOR_DIGEST) ||
            !runtimeBinding ||
            runtimeBinding.schemaVersion !== 'eai.generated_app_runtime_binding.v1' ||
            !workflowTemplate ||
            typeof workflowTemplate.id !== 'string' ||
            !workflowTemplate.id.trim() ||
            !Number.isInteger(workflowTemplate.version) ||
            workflowTemplate.version < 1 ||
            typeof workflowTemplate.digest !== 'string' ||
            !sha256DigestPattern.test(workflowTemplate.digest) ||
            typeof workflowTemplate.title !== 'string' ||
            !workflowTemplate.title.trim() ||
            !respondentAccess ||
            respondentAccess.mode !== 'anonymous' ||
            respondentAccess.submissionObjectType !== 'workflow-submission' ||
            respondentAccess.fileObjectType !== 'submission-file'
          ) {
            console.error('Generated app runtime binding is missing or invalid.');
            process.exit(1);
          }
          const pullRequestNumber = Number(env.EAI_REVIEW_PULL_REQUEST_NUMBER);
          if (event.ref !== env.GITHUB_REF ||
              env.GITHUB_REF !== 'refs/heads/__DEFAULT_BRANCH__' ||
              !/^[a-f0-9]{40}$/.test(env.EAI_REVIEW_SOURCE_SHA || '') ||
              !Number.isInteger(pullRequestNumber) || pullRequestNumber < 1) {
            console.error('Missing pull request number for generated app workflow evidence.');
            process.exit(1);
          }
          const evidence = {
            operationId: env.EAI_SOURCE_OPERATION_ID,
            targetTenantId: env.EAI_TARGET_TENANT_ID,
            environment: env.EAI_DEPLOYMENT_ENVIRONMENT || 'preview',
            sourceCommitSha: env.EAI_REVIEW_SOURCE_SHA,
            pullRequestNumber,
            repoOwner,
            repoName,
            installationId: env.EAI_GITHUB_INSTALLATION_ID,
            workflowPath: '.github/workflows/eai-app.yml',
            workflowBlobSha: env.WORKFLOW_BLOB_SHA,
            collectorDigest: env.COLLECTOR_DIGEST,
            ref: env.GITHUB_REF,
            workflowHeadBranch: '__DEFAULT_BRANCH__',
            commitSha: env.GITHUB_SHA,
            workflowRun: {
              id: env.GITHUB_RUN_ID,
              attempt: env.GITHUB_RUN_ATTEMPT,
              workflow: env.GITHUB_WORKFLOW,
              job: env.GITHUB_JOB,
            },
            configHash: env.EAI_CONFIG_HASH,
            artifactDigest: sha256Digest(env.ARTIFACT_DIGEST),
            imageArtifact: {
              id: env.IMAGE_ARTIFACT_ID,
              name: 'eai-generated-app-image',
              archiveDigest: sha256Digest(env.IMAGE_ARCHIVE_DIGEST),
            },
            imageDigest: sha256Digest(env.IMAGE_DIGEST),
            runtimeBinding,
            validationSummary: {
              status: 'deployment_requested_by_generated_app_workflow',
              releaseChannel: env.EAI_RELEASE_CHANNEL || 'preview',
              sourcePreparationStatus: 'completed',
              requiresTenantInfra: true,
            },
          };
          fs.writeFileSync(
            '.eai-build/evidence/generated-source-workflow-evidence.json',
            JSON.stringify(evidence, null, 2),
          );
          NODE
          curl -fsSL -X POST "${EAI_WORKFLOW_EVIDENCE_URL}" \
            -H "Authorization: Bearer ${{ steps.github-oidc.outputs.token }}" \
            -H "Content-Type: application/json" \
            --data @.eai-build/evidence/generated-source-workflow-evidence.json \
            | tee .eai-build/evidence/generated-source-workflow-evidence-response.json

      - name: Request deployment handoff
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          # Source metadata kept in the same shape as the template source-unknown handoff contract.
          # --repo "$GITHUB_REPOSITORY"
          # --workflow-run-id "$GITHUB_RUN_ID"
          cp \
            .eai-build/evidence/generated-source-workflow-evidence-response.json \
            .eai-build/evidence/deployment-handoff-response.json

      - name: Assert TenantInfra handoff submitted
        if: github.event_name == 'push'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const response = JSON.parse(
            fs.readFileSync('.eai-build/evidence/deployment-handoff-response.json', 'utf8'),
          );
          const request = response.deploymentRequest;
          const handoff = request?.handoff;
          const sourceBound =
            response.tenantId === process.env.EAI_TENANT_ID &&
            response.appKey === process.env.EAI_APP_KEY &&
            request?.appScopeTenantId === process.env.EAI_TENANT_ID &&
            request?.targetTenantId === process.env.EAI_MANAGED_REVIEW_TARGET_TENANT_ID &&
            request?.appKey === process.env.EAI_APP_KEY &&
            request?.sourceOperationId === process.env.EAI_SOURCE_OPERATION_ID &&
            request?.environment === process.env.EAI_DEPLOYMENT_ENVIRONMENT &&
            /^generated-merge-[a-f0-9]{64}$/.test(request?.operationId || '') &&
            request?.status === response.status &&
            request?.requiresTenantInfra === response.requiresTenantInfra &&
            handoff?.backend === 'TenantInfra';
          const reserved =
            response.status === 'handoff_pending' &&
            response.requiresTenantInfra === true &&
            handoff?.status === 'not_configured';
          const accepted =
            [
              'awaiting-runtime',
              'accepted',
              'queued',
              'running',
              'deployed-awaiting-readiness',
              'active',
            ].includes(response.status) &&
            response.requiresTenantInfra === false &&
            handoff?.status === 'configured';
          if (!sourceBound || (!reserved && !accepted)) {
            console.error('Workflow evidence did not reserve the source-bound deployment.');
            process.exit(1);
          }
          NODE

      - name: Upload deployment evidence
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: eai-generated-app-deployment-evidence
          path: .eai-build/evidence
          include-hidden-files: true

  complete-eai-managed-review:
    name: Complete EAI-managed source review
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.actor == '__MANAGED_REVIEW_OWNER__[bot]' && github.repository_owner == '__MANAGED_REVIEW_OWNER__' && github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: validate-generated-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact generated head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Ask EAI to complete verified review
        env:
          EAI_MANAGED_REVIEW_CALLBACK_URL: "__MANAGED_REVIEW_CALLBACK_URL__"
          EAI_TARGET_TENANT_ID: "__TARGET_TENANT_ID__"
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const callback = new URL(process.env.EAI_MANAGED_REVIEW_CALLBACK_URL || '');
          if (callback.protocol !== 'https:' ||
              !callback.pathname.endsWith('/api/platform/generated-apps/managed-review/workflow')) {
            throw new Error('Trusted EAI managed-review callback is not configured.');
          }
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          if (event.pull_request?.head?.repo?.id !== event.repository?.id ||
              event.pull_request?.head?.repo?.full_name !== process.env.GITHUB_REPOSITORY) {
            throw new Error('EAI managed review requires a same-repository pull request.');
          }
          const binding = JSON.parse(fs.readFileSync('.eai/generated-source-operation.json', 'utf8'));
          if (binding.schemaVersion !== 'eai.generated_source_operation.v1') {
            throw new Error('Generated source operation binding is invalid.');
          }
          const payload = JSON.stringify({
            appScopeTenantId: binding.tenantId,
            targetTenantId: process.env.EAI_TARGET_TENANT_ID,
            appKey: binding.appKey,
            operationId: binding.operationId,
          });
          const audience = 'api://enterprise-ai-publicapi/managed-review';
          const separator = process.env.ACTIONS_ID_TOKEN_REQUEST_URL.includes('?') ? '&' : '?';
          const tokenResponse = await fetch(
            process.env.ACTIONS_ID_TOKEN_REQUEST_URL + separator + 'audience=' + encodeURIComponent(audience),
            { headers: { Authorization: 'bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN } },
          );
          if (!tokenResponse.ok) throw new Error('GitHub workflow identity could not be issued.');
          const { value: token } = await tokenResponse.json();
          if (typeof token !== 'string' || !token) throw new Error('GitHub workflow identity is empty.');
          const retryDelays = [0, 2_000, 4_000, 8_000, 16_000, 30_000];
          for (const [attempt, delay] of retryDelays.entries()) {
            if (delay) await new Promise((resolve) => setTimeout(resolve, delay));
            let response;
            try {
              response = await fetch(callback, {
                method: 'POST',
                headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: payload,
                signal: AbortSignal.timeout(15_000),
              });
            } catch (error) {
              if (attempt < retryDelays.length - 1) continue;
              throw error;
            }
            if (!response.ok && ![429, 502, 503, 504].includes(response.status)) {
              throw new Error('EAI managed review verification failed with ' + response.status);
            }
            const result = response.ok ? await response.json() : null;
            if (result?.status === 'merged') break;
            if (attempt === retryDelays.length - 1) {
              throw new Error('EAI managed review did not complete after bounded retries.');
            }
          }
          NODE
